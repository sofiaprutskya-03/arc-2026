<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Idealized normalized two-link workspace</title>
  <desc id="desc">An illustrative half-annulus shows the geometric reach between the difference and sum of two link lengths. It is not a measured workspace for the physical robot.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0f4c81"/><stop offset="1" stop-color="#1597a5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14324a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="700" fill="#f5f8fb"/>
  <rect width="1200" height="92" fill="url(#header)"/>
  <text x="55" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">Idealized Reachable Workspace</text>
  <text x="55" y="70" font-family="Arial, sans-serif" font-size="15" fill="#d8f2f3">Normalized illustration only - actual geometry requires measured links, offsets, and joint limits</text>

  <path d="M350 135 A245 245 0 0 1 350 625 L350 467 A87 87 0 0 0 350 293 Z" fill="#dff1f2" stroke="#1597a5" stroke-width="3"/>
  <path d="M350 135 A245 245 0 0 1 350 625" fill="none" stroke="#0f6c78" stroke-width="5"/>
  <path d="M350 293 A87 87 0 0 1 350 467" fill="none" stroke="#d16a20" stroke-width="5" stroke-dasharray="9 6"/>
  <line x1="350" y1="640" x2="350" y2="115" stroke="#34546b" stroke-width="3"/>
  <line x1="330" y1="380" x2="630" y2="380" stroke="#34546b" stroke-width="3"/>
  <circle cx="350" cy="380" r="9" fill="#17364d"/>
  <text x="625" y="407" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17364d">r / (L1 + L2)</text>
  <text transform="translate(310 380) rotate(-90)" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17364d" text-anchor="middle">(z - h) / (L1 + L2)</text>
  <text x="505" y="158" font-family="Arial, sans-serif" font-size="14" fill="#0f6c78">outer boundary = L1 + L2</text>
  <text x="467" y="330" font-family="Arial, sans-serif" font-size="14" fill="#d16a20">inner boundary = |L1 - L2|</text>
  <text x="505" y="580" font-family="Arial, sans-serif" font-size="14" fill="#527086">ideal geometric region</text>

  <rect x="710" y="145" width="430" height="420" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="925" y="190" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17364d" text-anchor="middle">What the plot establishes</text>
  <text x="750" y="235" font-family="Arial, sans-serif" font-size="15" fill="#527086">1. Maximum radial reach:</text>
  <text x="750" y="265" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#0f6c78">d_max = L1 + L2</text>
  <text x="750" y="312" font-family="Arial, sans-serif" font-size="15" fill="#527086">2. Minimum unconstrained reach:</text>
  <text x="750" y="342" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#d16a20">d_min = |L1 - L2|</text>
  <text x="750" y="389" font-family="Arial, sans-serif" font-size="15" fill="#527086">3. Base rotation sweeps the planar region</text>
  <text x="750" y="414" font-family="Arial, sans-serif" font-size="15" fill="#527086">around the vertical axis.</text>
  <text x="750" y="461" font-family="Arial, sans-serif" font-size="15" fill="#527086">4. Servo limits, linkage collisions, and horn</text>
  <text x="750" y="486" font-family="Arial, sans-serif" font-size="15" fill="#527086">offsets reduce the actual workspace.</text>
  <rect x="745" y="516" width="360" height="30" rx="9" fill="#fff3e6"/>
  <text x="925" y="537" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b75d1c" text-anchor="middle">No physical dimensions are assumed in this figure.</text>

  <rect x="55" y="632" width="1090" height="40" rx="12" fill="#e7eef3"/>
  <text x="600" y="657" font-family="Arial, sans-serif" font-size="14" fill="#42647d" text-anchor="middle">The shaded region is theoretical. Numerical coordinates become meaningful only after measuring L1, L2, h and calibrating servo-to-joint offsets.</text>
</svg>
